<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c3aed"><title>Ngobrol</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2f8;font-family:Arial,sans-serif;color:#211b2d}.app{max-width:480px;min-height:100vh;margin:auto;background:#fff;display:flex;flex-direction:column}header{padding:18px;border-bottom:1px solid #eeeaf5}.top,.line{display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:800}.brand span{color:#7c3aed}.btn{border:0;border-radius:12px;padding:10px 13px;background:#7c3aed;color:white;cursor:pointer}.search{width:100%;padding:12px;margin-top:14px;border:0;border-radius:12px;background:#f4f2f8;font-size:14px}.stories{padding:15px 12px;border-bottom:1px solid #eeeaf5}.label{font-size:14px;font-weight:bold;margin:0 0 12px 4px}.storyrow{display:flex;gap:14px;overflow:auto}.story{border:0;background:white;min-width:60px;text-align:center;cursor:pointer;font-size:11px}.circle{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;background:linear-gradient(135deg,#f97316,#ec4899,#7c3aed);padding:3px}.circle b{background:#fff;border-radius:50%;width:100%;height:100%;display:grid;place-items:center;font-size:22px}.chatlist{padding:14px 10px;flex:1}.person{display:flex;align-items:center;gap:12px;padding:12px 6px;border:0;background:white;width:100%;text-align:left;cursor:pointer;border-radius:12px}.person:hover{background:#faf8ff}.avatar{width:48px;height:48px;border-radius:50%;background:#eee5ff;display:grid;place-items:center;font-size:22px;flex-shrink:0}.details{flex:1;min-width:0}.details strong{display:block;margin-bottom:5px}.details small{color:#777184;white-space:nowrap}.time{font-size:11px;color:#777184}.chatview{display:none;flex:1;flex-direction:column;min-height:70vh}.chathead{padding:12px 15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eeeaf5}.chathead .avatar{width:40px;height:40px}.messages{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1;background:#fbfaff}.bubble{padding:11px 13px;border-radius:17px;max-width:80%;font-size:14px;line-height:1.4}.them{background:#eeeaf5;align-self:flex-start;border-bottom-left-radius:5px}.mine{background:#7c3aed;color:white;align-self:flex-end;border-bottom-right-radius:5px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #eeeaf5}.composer input{flex:1;min-width:0;border:0;background:#f4f2f8;border-radius:20px;padding:12px;outline:none}.hint{padding:0 16px 14px;color:#777184;font-size:11px;line-height:1.4}.hidden{display:none!important}
</style></head>
<body><main class="app">
<header id="homeHeader"><div class="top"><div class="brand">ngo<span>brol</span></div><button class="btn" onclick="newChat()">＋ Chat</button></div><input class="search" id="search" placeholder="Cari teman..." oninput="filterPeople()"></header>
<section class="stories" id="stories"><div class="line"><p class="label">Story teman</p><button class="btn" onclick="addStory()">＋ Story</button></div><div class="storyrow" id="storyrow"></div></section>
<section class="chatlist" id="chatlist"><p class="label">Pesan</p><div id="people"></div></section>
<section class="chatview" id="chatview"><div class="chathead"><button class="btn" onclick="backHome()">←</button><div class="avatar" id="chatAvatar">🙂</div><div style="flex:1"><strong id="chatName">Nama</strong><div style="font-size:11px;color:#777184">aktif sekarang (demo)</div></div></div><div class="messages" id="messages"></div><form class="composer" onsubmit="sendMessage(event)"><input id="messageInput" placeholder="Tulis pesan..." autocomplete="off"><button class="btn">Kirim</button></form></section>
<p class="hint" id="hint">Demo tampilan chat dan Story. Pesan tersimpan di browser perangkat ini; belum terhubung ke pengguna lain.</p>
</main>
<script>
const initialPeople=[{name:"Alya",emoji:"👩🏻",last:"Hai! Lagi apa?",time:"09.42",messages:[["them","Hai! Lagi apa?"],["mine","Lagi nyobain aplikasi Ngobrol 😊"]]},{name:"Bima",emoji:"🧑🏻",last:"Oke, sampai nanti!",time:"Kemarin",messages:[["them","Jadi ketemu sore ini?"],["mine","Oke, sampai nanti!"]]},{name:"Salsa",emoji:"👩🏽",last:"Kirim foto dong 📸",time:"Sen",messages:[["them","Kirim foto dong 📸"]]}];
let people=JSON.parse(localStorage.getItem("ngobrol_people")||"null")||initialPeople;
let stories=JSON.parse(localStorage.getItem("ngobrol_stories")||"null")||[{name:"Cerita kamu",emoji:"＋"},{name:"Alya",emoji:"👩🏻"},{name:"Bima",emoji:"🧑🏻"},{name:"Salsa",emoji:"👩🏽"}];
let active=null;
function save(){localStorage.setItem("ngobrol_people",JSON.stringify(people));localStorage.setItem("ngobrol_stories",JSON.stringify(stories))}
function renderStories(){document.getElementById("storyrow").innerHTML=stories.map((s,i)=>`<button class="story" onclick="openStory(${i})"><span class="circle"><b>${s.emoji}</b></span>${s.name}</button>`).join("")}
function renderPeople(){let q=(document.getElementById("search").value||"").toLowerCase();document.getElementById("people").innerHTML=people.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<button class="person" onclick="openChat('${p.name.replace(/'/g,"\\'")}')"><span class="avatar">${p.emoji}</span><span class="details"><strong>${p.name}</strong><small>${escapeHtml(p.last||"Mulai ngobrol")}</small></span><span class="time">${p.time||""}</span></button>`).join("")||"<p>Teman tidak ditemukan.</p>"}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function filterPeople(){renderPeople()}
function openChat(name){active=people.find(p=>p.name===name);if(!active)return;document.getElementById("homeHeader").classList.add("hidden");document.getElementById("stories").classList.add("hidden");document.getElementById("chatlist").classList.add("hidden");document.getElementById("hint").classList.add("hidden");document.getElementById("chatview").style.display="flex";document.getElementById("chatName").textContent=active.name;document.getElementById("chatAvatar").textContent=active.emoji;renderMessages()}
function renderMessages(){document.getElementById("messages").innerHTML=(active.messages||[]).map(m=>`<div class="bubble ${m[0]==="mine"?"mine":"them"}">${escapeHtml(m[1])}</div>`).join("");let el=document.getElementById("messages");el.scrollTop=el.scrollHeight}
function sendMessage(e){e.preventDefault();let input=document.getElementById("messageInput"),v=input.value.trim();if(!v||!active)return;active.messages=active.messages||[];active.messages.push(["mine",v]);active.last=v;active.time="Baru saja";save();input.value="";renderMessages();renderPeople()}
function backHome(){document.getElementById("homeHeader").classList.remove("hidden");document.getElementById("stories").classList.remove("hidden");document.getElementById("chatlist").classList.remove("hidden");document.getElementById("hint").classList.remove("hidden");document.getElementById("chatview").style.display="none";active=null;renderPeople()}
function newChat(){let name=prompt("Nama teman:");if(!name||!name.trim())return;name=name.trim();if(!people.some(p=>p.name.toLowerCase()===name.toLowerCase()))people.unshift({name,emoji:"🙂",last:"Mulai ngobrol",time:"Baru",messages:[]});save();renderPeople();openChat(name)}
function addStory(){let text=prompt("Tulis Story singkat:");if(!text||!text.trim())return;stories.unshift({name:"Story kamu",emoji:"✨",text:text.trim(),created:Date.now()});save();renderStories();alert("Story demo ditambahkan. Story belum otomatis hilang setelah 24 jam.")}
function openStory(i){let s=stories[i];if(i===0||s.name==="Cerita kamu"){addStory();return}alert((s.name||"Story")+": "+(s.text||"Story contoh — fitur ini masih demo."))}
renderStories();renderPeople();
</script></body></html>
